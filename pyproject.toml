[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-hunter"
version = "0.4.0"
description = "Algeria-focused multi-profile job discovery, personal alerts and Telegram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "SQLAlchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
api = ["fastapi>=0.165,<0.166", "uvicorn>=0.54,<0.55"]
postgres = ["psycopg[binary]>=3.2,<4"]
ml = ["sentence-transformers>=5,<6"]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "jsonschema>=4,<5", "PyYAML>=6,<7"]

[project.scripts]
job-hunter = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
