name: Telegram workflow status
on:
  workflow_call:
    inputs:
      job_results:
        required: true
        type: string
      workflow_name:
        required: true
        type: string
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Read the trusted default branch, never execute PR code with bot credentials.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Notify Telegram independently of the application
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_RESULTS_JSON: ${{ inputs.job_results }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
        run: python scripts/notify_workflow.py
