name: Daily discovery
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Search size (scheduled runs always use daily)"
        type: choice
        options:
          - daily
          - smoke-test
        default: daily
  schedule:
    # 12:00 Africa/Algiers (UTC+1 all year). GitHub may start scheduled jobs late.
    - cron: "0 11 * * *"

permissions:
  contents: read

concurrency:
  group: job-hunter-daily
  cancel-in-progress: false

jobs:
  discover:
    # Choose ONE scheduler: set this repository variable only when using GitHub instead of Render.
    if: vars.SCHEDULER_BACKEND == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      PROFILES_JSON: ${{ secrets.PROFILES_JSON }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
      QWEN_MODEL: ${{ vars.QWEN_MODEL || 'qwen-plus' }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_BASE_URL: https://api.groq.com/openai/v1
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
      LLM_ENABLED: ${{ vars.LLM_ENABLED || 'false' }}
      PIPELINE_ENABLED: "true"
      NOTIFICATIONS_ENABLED: ${{ vars.NOTIFICATIONS_ENABLED || 'false' }}
      MATCHING_MAX_JOBS: ${{ inputs.mode == 'smoke-test' && '25' || '1000' }}
      SEARCH_SCOPE: algeria
      GMAIL_ENABLED: ${{ vars.GMAIL_ENABLED || 'false' }}
      GMAIL_LABEL: ${{ vars.GMAIL_LABEL || 'JobHunter/Alerts' }}
      GMAIL_OAUTH_JSON: ${{ secrets.GMAIL_OAUTH_JSON }}
      RUN_MODE: ${{ inputs.mode == 'smoke-test' && 'smoke-test' || 'daily' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build --tag ai-job-hunter:daily .
      - name: Run with runtime secrets
        run: >-
          docker run --rm
          --env DATABASE_URL --env MIGRATION_DATABASE_URL --env PROFILES_JSON
          --env TELEGRAM_BOT_TOKEN --env TELEGRAM_CHAT_ID
          --env QWEN_API_KEY --env QWEN_BASE_URL --env QWEN_MODEL --env LLM_ENABLED
          --env LLM_PROVIDER --env GROQ_API_KEY --env GROQ_BASE_URL --env GROQ_MODEL
          --env PIPELINE_ENABLED --env NOTIFICATIONS_ENABLED
          --env MATCHING_MAX_JOBS
          --env SEARCH_SCOPE --env GMAIL_ENABLED --env GMAIL_LABEL --env GMAIL_OAUTH_JSON --env RUN_MODE
          ai-job-hunter:daily
  telegram:
    if: ${{ always() }}
    needs: discover
    uses: ./.github/workflows/telegram-status.yml
    with:
      job_results: ${{ toJSON(needs) }}
      workflow_name: ${{ github.workflow }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
